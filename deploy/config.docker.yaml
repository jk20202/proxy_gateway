server:
  listen: ":10002"              # Web 管理控制台 / 消费 API 端口
  read_timeout_ms: 3000
  write_timeout_ms: 3000
  max_workers: 8192
  gateway_listen: ":10000"        # HTTP 代理网关端口：可用 curl -x 用户名:密码@域名:10000 直接走分组代理

health_check:
  interval_s: 60               # 每分钟检测一次所有代理
  timeout_ms: 6000           # 免费代理延迟阈值 3s 内需测出真实延迟，故超时放宽到 6s
  concurrency: 256           # 免费代理量级大，并发调高避免检测积压
  check_url: "http://127.0.0.1:10002/"  # mock target（单 URL 兜底，通常不用）
  # 5 个固定默认测试 URL（均为轻量 IP 检测服务，返回极少量数据，省代理流量）；
  # 新增 Provider 时 Web 界面默认全部勾选，可取消勾选不使用；也可自定义新增测试 URL。
  # 其中 ip-api.com 会返回代理出口 IP 的国家代码，检测存活的同时顺带刷新代理国家；
  # 若检测网站不返回国家，则保留该代理上一轮已测出的国家。
  check_urls:
    - { name: "ipapi-cc",   url: "http://ip-api.com/line/?fields=countryCode",           enabled: true }
    - { name: "ipapi-json", url: "http://ip-api.com/json/?fields=countryCode,query",     enabled: true }
    - { name: "ipify",      url: "https://api.ipify.org",                                enabled: true }
    - { name: "ipsb",       url: "https://ip.sb",                                        enabled: true }
    - { name: "icanhazip",  url: "https://icanhazip.com",                                enabled: true }
  max_fails: 3
  rebuild_interval_ms: 200

alerts:
  # provider 失效/恢复、池耗尽、刷新失败时告警。以下为示例配置，按需启用。
  dedup_seconds: 300          # 同一事件去重窗口，避免告警风暴
  monitor_interval_s: 15      # provider 状态监控周期
  recover_interval_s: 3600    # provider 掉线后每隔此秒数强制刷新尝试自动恢复；0=关闭

# 代理 IP 归属查询：入池后自动为每个代理标记国家/地区（用于分组的国内/海外/指定国家过滤）。
# 通过 ip-api.com 免费批量接口查询；私有/内网 IP 会被跳过（保持未知）。
geo:
  enabled: true
  # url: "http://ip-api.com/batch"   # 批量归属查询端点，可替换为自建服务
  enrich_interval_s: 60

# 账户：配置后 Web 与消费 API 均需鉴权（Web 用 name+password 登录，消费 API 用 token）。
# 首次启动会用此处的账户播种到 MySQL；之后以 MySQL 为准。
accounts:
  - name: "admin"
    password: "admin123"
    token: "replace-with-a-random-api-token"
    role: "admin"
    enabled: true
    groups: []

# SQLite 调用记录（每账户调用统计）。path 留空则关闭。
db:
  path: "/app/data/usage.db"
  batch_size: 200
  flush_interval_ms: 1000

# 调度分组：主池存活率跌破 min_alive_ratio 时自动切换备用池（依次尝试，首个可用即停）。
# 首次启动会用此处的分组播种到 MySQL；之后以 MySQL 为准。
groups:
  - name: "residential"
    type: "static"
    min_alive_ratio: 0.5
    username: "residential"       # 网关用户名（可选，不配则不可通过网关访问本组）
    password: "residential-pass"
    primary: ["mock-sticky", "mock-ippool"]
    primary_weights:
      mock-sticky: 2              # 权重已改为使用率百分比；此处兼容旧相对权重，首次播种后以 MySQL 为准
      mock-ippool: 1
    backups:
      - name: "fallback-tunnel"
        min_alive_ratio: 0
        providers: ["mock-tunnel"]

  - name: "charlespikachu-free"
    type: "free"
    min_alive_ratio: 0
    username: "free"
    password: "free-pass"
    primary: ["charlespikachu-free"]

providers:
  # 隧道型代理：固定网关 + 认证，平台侧自动轮换出口 IP
  - name: "mock-tunnel"
    type: "tunnel"
    enabled: true
    min_alive_ratio: 0.1
    check_interval_s: 60
    check_url: "http://127.0.0.1:10002/"
    country: "US"                 # 显式指定国家（海外），入池直接打标，跳过 IP 归属查询
    tunnel:
      scheme: "http"
      gateway: "127.0.0.1"
      port: 10001
      username: ""
      password: ""

  # IP 池型代理：调用平台提取 API 拿到一批 IP:Port，作为兜底（低优先级）
  - name: "mock-ippool"
    type: "ip_pool"
    enabled: false
    min_alive_ratio: 0
    check_interval_s: 60
    check_url: "http://127.0.0.1:10002/"
    country: "CN"
    ip_pool:
      extract_url: "http://127.0.0.1:10003/get"
      format: "text"
      refresh_interval_s: 30
      expire_after_s: 600
      max_proxies: 100

  # 长效静态 IP（粘性）：同客户端在 sticky_seconds 时效内固定同一 IP，到期后才轮换
  - name: "mock-sticky"
    type: "sticky"
    enabled: true
    sticky_seconds: 60
    check_interval_s: 60
    check_url: "http://127.0.0.1:10002/"
    country: "HK"
    ip_pool:
      extract_url: "http://127.0.0.1:10003/get"
      format: "text"
      refresh_interval_s: 120
      expire_after_s: 3600
      max_proxies: 100

  # 免费代理源：采集自公共免费源，只保留上报延迟低于 max_speed_ms 的 HTTP 代理。
  - name: "charlespikachu-free"
    type: "free"
    enabled: true
    min_alive_ratio: 0
    check_interval_s: 60
    check_url: "http://www.gstatic.com/generate_204"
    free:
      feed_url: "https://charlespikachu.github.io/freeproxy/proxies.json"
      refresh_interval_s: 600
      max_speed_ms: 3000
      delete_latency_ms: 3000

# 持久化存储：MySQL 存低频设置（账户/分组/provider 配置），Redis 缓存高频代理状态（延迟/国家/存活）。
# 本文件是 docker-compose 使用的版本：addr 指向 compose 内网服务名。
# 转线上：把 addr 改成你的 MySQL/Redis 地址即可（如 mysql.example.com:3306），无需改代码。
storage:
  mysql:
    addr: "mysql:3306"          # compose 服务名；本地本机可用 127.0.0.1:3306
    user: "proxy"
    pass: "proxy_pass"
    db: "proxy_pool"
  redis:
    addr: "redis:6379"          # compose 服务名；本地本机可用 127.0.0.1:6379
