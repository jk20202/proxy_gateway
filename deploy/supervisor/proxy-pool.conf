; proxy-pool supervisor 配置示例
; 放置到 /etc/supervisor/conf.d/proxy-pool.conf 后执行：
;   supervisorctl reread && supervisorctl update && supervisorctl status
;
; 注意：默认开启了 MySQL+Redis 存储（config.yaml 的 storage 段）。
; 本方式不负责安装 MySQL/Redis，请自行准备（本机或线上均可），
; 并把 config.yaml 中 storage.mysql.addr / storage.redis.addr 指向它们。

[program:proxy-pool]
directory=/opt/proxy-pool
command=/opt/proxy-pool/proxy-pool -config /opt/proxy-pool/config.yaml
autostart=true
autorestart=true
startsecs=5
startretries=5
user=root
redirect_stderr=true
stdout_logfile=/var/log/proxy-pool/out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/proxy-pool/err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
environment=GIN_MODE=release,TZ=Asia/Shanghai
