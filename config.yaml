server:
  listen: ":9999"                    # Web 管理控制台 + 消费/管理 API
  read_timeout_ms: 3000
  write_timeout_ms: 3000
  max_workers: 8192
  gateway_listen: ":1024"            # HTTP 代理网关：curl -x 用户名:密码@域名:1024

# 持久化：账户/Provider/分组/系统设置以 JSON 文件形式存放在 data_dir 目录，
# 单二进制即可运行，无需 MySQL/Redis。
data_dir: "data"

health_check:
  interval_s: 60
  timeout_ms: 6000
  concurrency: 256
  check_url: ""
  check_urls:
    - { name: "ipapi-cc",   url: "http://ip-api.com/line/?fields=countryCode", enabled: true }
    - { name: "ipapi-json", url: "http://ip-api.com/json/?fields=countryCode,query", enabled: true }
    - { name: "ipify",      url: "https://api.ipify.org", enabled: true }
    - { name: "ipsb",       url: "https://ip.sb", enabled: true }
    - { name: "icanhazip",  url: "https://icanhazip.com", enabled: true }
  max_fails: 3
  rebuild_interval_ms: 200

alerts:
  dedup_seconds: 300
  monitor_interval_s: 15
  recover_interval_s: 3600

# 代理 IP 归属查询（可选）。关闭可减少对外部接口的依赖。
geo:
  enabled: true
  enrich_interval_s: 60

# 账户：配置后 Web 与消费 API 均需鉴权。首个 admin 账户在此播种，
# 后续账户请在 Web「账户管理」中增删；密码在首次登录后自动加盐哈希存储。
accounts:
  - name: "admin"
    password: "admin123"
    token: "change-me-to-a-random-token"
    role: "admin"
    enabled: true
    groups: []

# SQLite 调用记录（按账户统计）。path 留空则关闭。
db:
  path: "usage.db"
  batch_size: 200
  flush_interval_ms: 1000

# 系统设置（可在 Web「系统设置」页实时修改并持久化）。
settings:
  site_name: "Proxy Pool"
  registration_enabled: false
  theme_default: "dark"

# 调度分组：主池存活率跌破 min_alive_ratio 时自动切换备用池，恢复自动切回。
# 初始为空，请在 Web「调度分组」中创建。
groups: []

# 代理平台：初始为空，请在 Web「代理平台」中添加（tunnel/ip_pool/sticky/free）。
providers: []
