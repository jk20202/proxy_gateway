server:
  listen: ":8080"
  read_timeout_ms: 3000
  write_timeout_ms: 3000
  max_workers: 8192
  gateway_listen: ":10000"        # HTTP 代理网关端口：可用 curl -x 用户名:密码@域名:10000 直接走分组代理

health_check:
  interval_s: 60               # 每分钟检测一次所有代理
  timeout_ms: 6000           # 免费代理延迟阈值 3s 内需测出真实延迟，故超时放宽到 6s
  concurrency: 256           # 免费代理量级大，并发调高避免检测积压
  check_url: "http://127.0.0.1:10002/"  # mock target
  max_fails: 3
  rebuild_interval_ms: 200

alerts:
  # provider 失效/恢复、池耗尽、刷新失败时告警。以下为示例配置，按需启用。
  dedup_seconds: 300          # 同一事件去重窗口，避免告警风暴
  monitor_interval_s: 15      # provider 状态监控周期
  recover_interval_s: 3600    # provider 掉线后每隔此秒数强制刷新尝试自动恢复；0=关闭

# 代理 IP 归属查询：入池后自动为每个代理标记国家/地区（用于分组的国内/海外/指定国家过滤）。
# 通过 ip-api.com 免费批量接口查询；私有/内网 IP 会被跳过（保持未知）。
# 中国内地=国内(CN)；其余全部=海外，含中国香港(HK)。
geo:
  enabled: true
  # url: "http://ip-api.com/batch"   # 批量归属查询端点，可替换为自建服务
  enrich_interval_s: 60               # 每隔多少秒扫描一次未标记国家的代理并回填

# 账户：配置后 Web 与消费 API 均需鉴权（Web 用 name+password 登录，消费 API 用 token）。
# 留空数组则鉴权关闭（不推荐生产使用）。
accounts:
  - name: "admin"
    password: "admin123"
    token: "replace-with-a-random-api-token"
    role: "admin"            # admin 可管理全部；user 仅可调用消费 API
    enabled: true
    groups: []               # 该账户可用的调度分组，留空=全部

# SQLite 调用记录（每账户调用统计）。path 留空则关闭。
db:
  path: "usage.db"
  batch_size: 200
  flush_interval_ms: 1000

# 调度分组：主池存活率跌破 min_alive_ratio 时自动切换备用池（依次尝试，首个可用即停）。
# 组内 provider 全部为非隧道型（ip_pool/sticky/free）时用平滑加权轮询(SWRR)，含隧道型则加权随机。
# username/password：网关凭证。配置后即可用 `curl -x 用户名:密码@域名:10000 <目标URL>` 直接经由本组代理转发请求，
# 网关按凭证匹配分组并从该组实时取一个可用代理中转，组内主备池自动切换对客户端透明。
groups:
  - name: "residential"
    type: "static"
    min_alive_ratio: 0.5
    username: "residential"       # 网关用户名（可选，不配则不可通过网关访问本组）
    password: "residential-pass"
    primary: ["mock-sticky", "mock-ippool"]
    primary_weights:              # 主池中各 provider 的调度权重（已从 Provider 层迁移到分组层）
      mock-sticky: 2              # 缺省 1；权重越大流量分配越多
      mock-ippool: 1
    backups:
      - name: "fallback-tunnel"
        min_alive_ratio: 0
        providers: ["mock-tunnel"]

  # 免费代理分组：按"域名相关+free"命名，采集自公共免费源，延迟低于 3 秒的才收，
  # 每分钟检测一次，实测延迟超过 3 秒或不可用即删；无可用时同样支持备用池兜底。
  - name: "charlespikachu-free"
    type: "free"
    min_alive_ratio: 0
    username: "free"              # 网关用户名
    password: "free-pass"
    primary: ["charlespikachu-free"]
    # backups:
    #   - name: "fallback-paid"
    #     min_alive_ratio: 0
    #     providers: ["mock-tunnel"]

providers:
  # 隧道型代理：固定网关 + 认证，平台侧自动轮换出口 IP
  # check_interval_s 为该 provider 的检测频率（池内 IP 多久检测一次延迟，0=用全局 health_check.interval_s）
  - name: "mock-tunnel"
    type: "tunnel"
    enabled: true
    min_alive_ratio: 0.1
    check_interval_s: 60          # 检测频率：每 60s 检测一次延迟
    check_url: "http://127.0.0.1:10002/"
    country: "US"                 # 显式指定国家（海外），入池直接打标，跳过 IP 归属查询
    tunnel:
      scheme: "http"
      gateway: "127.0.0.1"
      port: 10001
      username: ""
      password: ""

  # IP 池型代理：调用平台提取 API 拿到一批 IP:Port，作为兜底（低优先级）
  - name: "mock-ippool"
    type: "ip_pool"
    enabled: true
    min_alive_ratio: 0
    check_interval_s: 60
    check_url: "http://127.0.0.1:10002/"
    country: "CN"                 # 国内
    ip_pool:
      extract_url: "http://127.0.0.1:10003/get"
      format: "text"
      refresh_interval_s: 30      # 提取频率：每 30s 从提取 API 拉一次新 IP
      expire_after_s: 600
      max_proxies: 100

  # 长效静态 IP（粘性）：同客户端在 sticky_seconds 时效内固定同一 IP，到期后才轮换
  - name: "mock-sticky"
    type: "sticky"
    enabled: true
    sticky_seconds: 60       # 粘性时长：60=1分钟、300=5分钟，可任意设置
    check_interval_s: 60
    check_url: "http://127.0.0.1:10002/"
    country: "HK"                 # 中国香港（也属海外）
    ip_pool:
      extract_url: "http://127.0.0.1:10003/get"
      format: "text"
      refresh_interval_s: 120     # 提取频率
      expire_after_s: 3600
      max_proxies: 100

  # 免费代理源：采集自公共免费源，只保留上报延迟低于 max_speed_ms 的 HTTP 代理。
  # 免费代理不可用即删（健康检测一次失败，或实测延迟超过 delete_latency_ms），不告警。
  # 不设上限、不过期：只要代理还能用、延迟达标就一直保留，按检测频率自动淘汰超标者。
  - name: "charlespikachu-free"
    type: "free"
    enabled: true
    min_alive_ratio: 0
    check_interval_s: 60          # 检测频率：池内代理每 60s 检测一次延迟
    check_url: "http://www.gstatic.com/generate_204"   # 免费代理的真实连通性检测目标（204 轻量探测）
    free:
      feed_url: "https://charlespikachu.github.io/freeproxy/proxies.json"
      refresh_interval_s: 600               # 采集频率：每 10 分钟重新采集一次
      max_speed_ms: 3000                    # 只收上报延迟低于 3 秒的（页面上自己的测速）
      delete_latency_ms: 3000               # 每次检测实测延迟超过 3 秒的直接删除
